# ===========================================================================
#  Dependabot — Vision One CREM Report Generator
#
#  Este repositorio consulta APIs externas (NVD, KEV, EPSS, Trend Vision One)
#  y genera informes, asi que arrastra dependencias de red y de ofimatica
#  (requests, python-docx, reportlab...). Son justo las que conviene tener al
#  dia sin tener que acordarse de mirarlas.
#
#  Hay dos manifests: requirements.txt (declarado) y requirements.lock
#  (fijado). Dependabot actualiza el primero y regenera el segundo.
# ===========================================================================
version: 2

updates:
  # --- GitHub Actions (.github/workflows/) --------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"

  # --- pip (requirements.txt + requirements.lock) -------------------------
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
    groups:
      dependencias-menores:
        update-types:
          - "minor"
          - "patch"
